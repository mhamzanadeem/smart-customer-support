services:

  backend:
    build:
      context: ./backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

  frontend:
    build:
      context: ./frontend

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    ports:
      - "3000:3000"

    depends_on:
      - backend